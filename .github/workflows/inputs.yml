name: dispatch
on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: log level
        required: true
        type: choice
        options:
          - info
          - warning
          - debug
        default: warning
      environment:
        type: environment
      matrix:
        required: true
        type: string

jobs:
  log-the-inputs:
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(inputs.matrix) }}
    env:
      LEVEL: ${{ inputs.logLevel }}
      TAGS: ${{ inputs.tags }}
      ENVIRONMENT: ${{ inputs.environment }}
    steps:
     - name: "${{ matrix.os }} - ${{ matrix.version }}"
     - run: |
          echo "Log level: $LEVEL"
          echo "Tags: $TAGS"
          echo "Environment: $ENVIRONMENT"
        
    
