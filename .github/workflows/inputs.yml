name: dispatch
on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: log level
        required: true
        type: choice
        options:
          - info
          - warning
          - debug
        default: warning
      environment:
        type: environment

jobs:
  log-the-inputs:
    runs-on: ubuntu-latest
    env:
      LEVEL: ${{ inputs.logLevel }}
      TAGS: ${{ inputs.tags }}
      ENVIRONMENT: ${{ inputs.environment }}
    steps:
     - run: |
          echo "Log level: $LEVEL"
          echo "Tags: $TAGS"
          echo "Environment: $ENVIRONMENT"
    
